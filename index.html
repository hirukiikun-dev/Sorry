<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Punch Jagi, I'm Sorry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one stage, chibi as the punching bag in the middle, anger meter above, letter appears when anger hits zero */
:root{
  --bg:#ffe3ee; --bg2:#ffc4da; --ink:#5a1838; --ink-soft:#9b4a72;
  --pink:#ff4f93; --pink-deep:#e0256f; --cream:#fff6fa; --mint:#7fe0c2;
  --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--body);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(var(--bg2) 1.6px,transparent 1.7px);
  background-size:22px 22px;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;
  display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1;margin:0;
  color:var(--pink-deep);text-wrap:balance;text-shadow:3px 3px 0 var(--cream),5px 5px 0 var(--bg2)}
.sub{margin:0;max-width:34ch;font-size:1.05rem;color:var(--ink-soft);font-weight:700;text-wrap:balance}

/* meter */
.meter{width:min(100%,420px);display:flex;flex-direction:column;gap:6px}
.meter-row{display:flex;justify-content:space-between;font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.meter-row span:last-child{font-variant-numeric:tabular-nums}
.bar{height:18px;border-radius:99px;background:var(--cream);border:3px solid var(--ink);overflow:hidden}
.fill{height:100%;width:100%;background:repeating-linear-gradient(-45deg,var(--pink) 0 10px,var(--pink-deep) 10px 20px);
  transition:width .35s cubic-bezier(.3,1.6,.5,1)}

/* stage */
.stage{position:relative;width:min(84vw,360px);aspect-ratio:1;max-width:100%;margin-top:26px;touch-action:manipulation;user-select:none}
.bubble{position:absolute;left:50%;top:-30px;transform:translate(-50%,-50%) scale(0);z-index:5;
  background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-weight:800;
  white-space:nowrap;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:var(--cream);
  border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.show{transform:translate(-50%,-50%) scale(1)}
.bag{position:absolute;inset:0;border-radius:50%;cursor:pointer;border:6px solid var(--ink);background:var(--cream);
  box-shadow:0 0 0 8px var(--pink),0 18px 0 8px var(--pink-deep);overflow:hidden;outline:none;padding:0;
  transform-origin:50% 100%;}
.bag:focus-visible{box-shadow:0 0 0 8px var(--pink),0 0 0 14px var(--ink)}
.bag img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transition:filter .15s}
.bag.hit img{filter:saturate(1.4) hue-rotate(-12deg) brightness(1.08)}
.bag.hit{animation:squish .38s cubic-bezier(.3,1.6,.5,1)}
.bag.crit{animation:squishBig .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes squish{0%{transform:scale(1)}25%{transform:scale(1.12,.84) rotate(var(--tilt))}60%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
@keyframes squishBig{0%{transform:scale(1)}20%{transform:scale(1.25,.7) rotate(calc(var(--tilt)*2))}50%{transform:scale(.9,1.12) rotate(calc(var(--tilt)*-1))}100%{transform:scale(1)}}
.idle{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}

.bandaid{position:absolute;width:70px;height:26px;pointer-events:none;z-index:2;transform:translate(-50%,-50%) rotate(var(--r));
  animation:stick .25s cubic-bezier(.3,1.8,.5,1)}
@keyframes stick{from{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.8);opacity:0}}

.fx{position:fixed;pointer-events:none;z-index:20}
.pow{font-family:var(--display);color:var(--cream);font-size:2.2rem;-webkit-text-stroke:2px var(--ink);
  paint-order:stroke fill;text-shadow:3px 3px 0 var(--pink-deep);transform:translate(-50%,-50%);animation:pow .7s ease-out forwards}
.pow.big{font-size:3.4rem;color:var(--mint)}
@keyframes pow{0%{transform:translate(-50%,-50%) scale(.3) rotate(-10deg);opacity:1}30%{transform:translate(-50%,-80%) scale(1.15) rotate(6deg)}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.glove{width:96px;height:96px;transform:translate(-50%,-50%);animation:jab .28s ease-out forwards}
@keyframes jab{0%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--gr)) scale(.6);opacity:0}
  45%{transform:translate(-50%,-50%) rotate(var(--gr)) scale(1.1);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)*.4),calc(-50% + var(--dy)*.4)) rotate(var(--gr)) scale(.9);opacity:0}}
.star{width:14px;height:14px;background:var(--pink);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  animation:burst .6s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(200deg) scale(.2);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}

.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.chip{background:var(--cream);border:3px solid var(--ink);border-radius:99px;padding:6px 14px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.chip b{color:var(--pink-deep)}
.combo{opacity:0;transition:opacity .2s}
.combo.on{opacity:1}
.hint{font-size:.85rem;color:var(--ink-soft);font-weight:700;margin:0}

/* letter */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;
  background:rgba(90,24,56,.45);backdrop-filter:blur(4px)}
.letter{position:relative;width:min(100%,460px);background:var(--cream);border:4px solid var(--ink);border-radius:26px;
  padding:28px 22px 24px;box-shadow:10px 10px 0 var(--pink-deep);text-align:left;animation:pop .45s cubic-bezier(.3,1.6,.5,1);
  max-height:calc(100% - 20px);overflow:auto}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.letter h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 10px;color:var(--pink-deep);line-height:1.05}
.letter p{margin:0 0 12px;line-height:1.55;font-weight:500;max-width:60ch}
.sig{font-weight:800;color:var(--ink-soft)}
.btns{position:relative;display:flex;gap:12px;align-items:center;margin-top:18px;min-height:56px;flex-wrap:wrap}
button.btn{font:inherit;font-weight:800;font-size:1rem;cursor:pointer;border:3px solid var(--ink);border-radius:99px;
  padding:12px 22px;background:var(--pink);color:var(--cream);box-shadow:0 5px 0 var(--ink);transition:transform .15s,box-shadow .15s}
button.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button.btn:focus-visible{outline:3px dashed var(--pink-deep);outline-offset:3px}
button.btn.ghost{background:var(--cream);color:var(--ink)}
#noBtn{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.heart{position:fixed;top:-40px;z-index:40;pointer-events:none;width:26px;height:26px;background:var(--pink);
  clip-path:path("M13 24 C13 24 1 16 1 8.5 A6 6 0 0 1 13 6 A6 6 0 0 1 25 8.5 C25 16 13 24 13 24Z");
  animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<main class="wrap" id="app">

  <p class="sub">I know I messed up. Before you read anything, you get to punch Jagi. As many times as it takes.</p>

    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

    </button>
  </div>

  <div class="stats">
    <span class="chip">Punches <b id="count">0</b></span>
    <span class="chip combo" id="combo">Combo <b id="comboN">x2</b></span>
  </div>
  <p class="hint">Tap or click my face. Space bar works too.</p>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="letter" role="dialog" aria-modal="true" aria-labelledby="lt">
    <h2 id="lt">Okay. Now the real part.</h2>
    <div id="letterBody"></div>
    <p class="sig" id="sig"></p>
    <div class="btns" id="btns">
      <button class="btn" id="yesBtn">I forgive you</button>
      <button class="btn ghost" id="noBtn">Nope</button>
    </div>
  </div>
</div>

<script>
/* ===== Edit your message here ===== */
const CONFIG = {
  letter: [
    "I'm really sorry. I was wrong, and I know it hurt you.",
    "You didn't deserve that, and I'm not going to make excuses for it.",
    "I'll do better. And if you're still mad, the punch button is always open."
  ],
  signature: "— Jagi (bruised, but sincere)",
  doneTitle: "Thank you.",
  doneText: "You're the best. I mean it. Same time next time I mess up?"
};
/* ================================== */

const $ = s => document.querySelector(s);
const bag=$('#bag'), bubble=$('#bubble'), fill=$('#fill'), pct=$('#pct'), countEl=$('#count'),
      comboEl=$('#combo'), comboN=$('#comboN'), app=$('#app'), overlay=$('#overlay');
let anger=100, count=0, combo=0, lastHit=0, done=false, bandaids=[];

const LINES=["ow","ok fair","not the hair!","i deserved that","OW","ow ow ow","valid","my face :(","noted","harder? ok","that one hurt","sorry sorry sorry","i felt that in my soul","ok you're strong"];
const CRIT=["CRITICAL HIT","K.O.?!","seeing stars","WHY SO STRONG"];
const POWS=["POW!","BAM!","WHAM!","BOP!","SMACK!","THWACK!"];

let ac;
function sfx(big){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(big?220:320,t); o.frequency.exponentialRampToValueAtTime(45,t+.18);
    g.gain.setValueAtTime(.55,t); g.gain.exponentialRampToValueAtTime(.001,t+.22);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+.25);
    const n=ac.createBufferSource(), b=ac.createBuffer(1,ac.sampleRate*.08,ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const ng=ac.createGain(); ng.gain.value=big?.5:.3; n.buffer=b; n.connect(ng).connect(ac.destination); n.start(t);
  }catch(e){}
}

function say(text){
  bubble.textContent=text; bubble.classList.add('show');
  clearTimeout(say.t); say.t=setTimeout(()=>bubble.classList.remove('show'),1100);
}

const GLOVE=`<svg viewBox="0 0 100 100"><path d="M30 18c14-12 46-10 56 10 9 18 4 38-10 48l-34 2c-14-4-24-18-24-34 0-12 4-20 12-26z" fill="#ff4f93" stroke="#5a1838" stroke-width="5"/>
<path d="M22 40c-8 2-12 10-8 18 3 6 10 8 16 5" fill="#ff7aae" stroke="#5a1838" stroke-width="5"/>
<path d="M40 30c10-6 26-6 34 2" fill="none" stroke="#fff6fa" stroke-width="5" stroke-linecap="round" opacity=".7"/>
<rect x="38" y="74" width="40" height="20" rx="6" fill="#fff6fa" stroke="#5a1838" stroke-width="5"/></svg>`;
const BANDAID=`<svg viewBox="0 0 70 26"><rect x="1.5" y="1.5" width="67" height="23" rx="11.5" fill="#ffd2a8" stroke="#5a1838" stroke-width="3"/>
<rect x="24" y="4" width="22" height="18" rx="3" fill="#ffb3cf"/><g fill="#5a1838" opacity=".35"><circle cx="30" cy="10" r="1.5"/><circle cx="40" cy="10" r="1.5"/><circle cx="30" cy="16" r="1.5"/><circle cx="40" cy="16" r="1.5"/></g></svg>`;

function fx(html,cls,x,y,style={}){
  const el=document.createElement('div'); el.className='fx '+cls; el.innerHTML=html;
  el.style.left=x+'px'; el.style.top=y+'px'; Object.entries(style).forEach(([k,v])=>el.style.setProperty(k,v));
  document.body.appendChild(el); setTimeout(()=>el.remove(),900); return el;
}

function punch(x,y){
  if(done) return;
  const now=performance.now();
  combo = now-lastHit<450 ? combo+1 : 1; lastHit=now;
  const crit = Math.random()<.14 || combo%8===0;
  const dmg = crit ? 14+Math.random()*6 : 4+Math.random()*5 + Math.min(combo,6)*.4;
  anger=Math.max(0,anger-dmg); count++;

  // glove flies in from the side the click came from
  const r=bag.getBoundingClientRect(), fromLeft = x < r.left+r.width/2;
  fx(GLOVE,'glove',x,y,{'--dx':(fromLeft?-140:140)+'px','--dy':'60px','--gr':(fromLeft?'-20deg':'200deg')});
  fx(crit?pick(["K.O.!","CRIT!","KAPOW!"]):pick(POWS),'pow'+(crit?' big':''),x+(Math.random()*40-20),y-20);
  for(let i=0;i<(crit?12:6);i++){
    const a=Math.random()*Math.PI*2, d=50+Math.random()*(crit?90:50);
    fx('','star',x,y,{'--x':Math.cos(a)*d+'px','--y':Math.sin(a)*d+'px'});
  }

  bag.classList.remove('idle','hit','crit'); void bag.offsetWidth;
  bag.style.setProperty('--tilt',(fromLeft?6:-6)+'deg');
  bag.classList.add(crit?'crit':'hit');
  if(crit){ app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake'); }
  sfx(crit);
  if(navigator.vibrate) try{navigator.vibrate(crit?40:15)}catch(e){}

  // bandaid where you hit (keep the 6 most recent)
  if(Math.random()<.45 || crit){
    const b=document.createElement('div'); b.className='bandaid'; b.innerHTML=BANDAID;
    b.style.left=((x-r.left)/r.width*100)+'%'; b.style.top=((y-r.top)/r.height*100)+'%';
    b.style.setProperty('--r',(Math.random()*80-40)+'deg');
    $('.stage').appendChild(b); bandaids.push(b); if(bandaids.length>6) bandaids.shift().remove();
  }

  say(crit?pick(CRIT):pick(LINES));
  countEl.textContent=count;
  comboN.textContent='x'+combo; comboEl.classList.toggle('on',combo>1);
  fill.style.width=anger+'%'; pct.textContent=Math.round(anger)+'%';

  clearTimeout(punch.idle); punch.idle=setTimeout(()=>{bag.classList.remove('hit','crit');bag.classList.add('idle');comboEl.classList.remove('on')},900);
  if(anger<=0){ done=true; setTimeout(()=>say("...are we okay now?"),500); setTimeout(openLetter,1500); }
}
const pick=a=>a[Math.floor(Math.random()*a.length)];

bag.addEventListener('pointerdown',e=>{e.preventDefault();punch(e.clientX,e.clientY)});
bag.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='Enter'){e.preventDefault();const r=bag.getBoundingClientRect();
    punch(r.left+r.width*(.3+Math.random()*.4),r.top+r.height*(.3+Math.random()*.4));}
});
document.addEventListener('keydown',e=>{ if(e.key===' '&&document.activeElement!==bag&&overlay.hidden){e.preventDefault();bag.focus();} });

// letter
function openLetter(){
  $('#letterBody').innerHTML=CONFIG.letter.map(p=>`<p>${p}</p>`).join('');
  $('#sig').textContent=CONFIG.signature;
  overlay.hidden=false; $('#yesBtn').focus();
}
let noTries=0;
const NO_LINES=["Nope","you sure?","really??","pls",":(","ok I'll wait","try the other one"];
function dodge(){
  noTries++;
  const no=$('#noBtn'), yes=$('#yesBtn');
  no.textContent=NO_LINES[Math.min(noTries,NO_LINES.length-1)];
  const s=Math.max(.45,1-noTries*.1);
  no.style.transform=`translate(${(Math.random()*120-40)|0}px,${(Math.random()*50-25)|0}px) scale(${s})`;
  yes.style.transform=`scale(${Math.min(1.6,1+noTries*.1)})`;
  if(noTries>=7){ no.hidden=true; }
}
$('#noBtn').addEventListener('pointerenter',e=>{ if(e.pointerType==='mouse') dodge(); });
$('#noBtn').addEventListener('click',dodge);
function onYes(){
  $('#lt').textContent=CONFIG.doneTitle;
  $('#letterBody').innerHTML=`<p>${CONFIG.doneText}</p>`;
  $('#sig').textContent=CONFIG.signature;
  $('#btns').innerHTML='<button class="btn ghost" id="again">Punch Jagi again</button>';
  $('#again').addEventListener('click',reset);
  for(let i=0;i<46;i++){
    const h=document.createElement('div'); h.className='heart';
    h.style.left=Math.random()*100+'vw'; h.style.animationDuration=(2.2+Math.random()*2.5)+'s';
    h.style.animationDelay=(Math.random()*1.2)+'s'; h.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    h.style.transform=`scale(${.6+Math.random()*.9})`;
    if(Math.random()<.35) h.style.background='var(--pink-deep)';
    document.body.appendChild(h); setTimeout(()=>h.remove(),6000);
  }
}
$('#yesBtn').addEventListener('click',onYes);
function reset(){
  anger=100;count=0;combo=0;done=false;noTries=0;
  bandaids.forEach(b=>b.remove()); bandaids=[];
  fill.style.width='100%'; pct.textContent='100%'; countEl.textContent='0';
  $('#lt').textContent='Okay. Now the real part.';
  $('#btns').innerHTML='<button class="btn" id="yesBtn">I forgive you</button><button class="btn ghost" id="noBtn">Nope</button>';
  $('#noBtn').addEventListener('pointerenter',e=>{ if(e.pointerType==='mouse') dodge(); });
  $('#noBtn').addEventListener('click',dodge);
  $('#yesBtn').addEventListener('click',onYes);
  overlay.hidden=true; say("round two. go.");
}
</script>

</body></html>
